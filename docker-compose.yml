services:
  postgres:
    image: postgres:17
    container_name: scalechat-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: scalechat
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: scalechat

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalechat -d scalechat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
